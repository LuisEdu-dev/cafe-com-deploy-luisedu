name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cafe
          POSTGRES_PASSWORD: cafe
          POSTGRES_DB: cafe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cafe -d cafe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Banco descartável do service container — nunca o de produção.
      TEST_DATABASE_URL: postgresql+psycopg://cafe:cafe@localhost:5432/cafe_test

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Auditoria de dependências (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Testes com cobertura
        run: pytest

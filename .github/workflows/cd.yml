name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Um deploy por vez; nunca cancela um deploy em andamento.
  group: cd-main
  cancel-in-progress: false

env:
  IMAGEM: ghcr.io/luisedu-dev/cafe-com-deploy-luisedu

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      versao: ${{ steps.versao.outputs.versao }}
      imagem: ${{ steps.versao.outputs.imagem }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Definir versão
        id: versao
        run: |
          versao="sha-${GITHUB_SHA::7}"
          echo "versao=$versao" >> "$GITHUB_OUTPUT"
          echo "imagem=$IMAGEM:$versao" >> "$GITHUB_OUTPUT"

      - name: Metadados da imagem
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGEM }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ steps.versao.outputs.versao }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumo
        env:
          IMAGEM_VERSAO: ${{ steps.versao.outputs.imagem }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Imagem publicada"
            echo "- \`$IMAGEM_VERSAO\`"
            echo "- digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

# Ambiente local completo: docker compose up --build
# Credenciais abaixo são só do Postgres descartável local, não de nenhum ambiente real.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cafe
      POSTGRES_PASSWORD: cafe
      POSTGRES_DB: cafe
    ports:
      - "5432:5432"
    volumes:
      - dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cafe -d cafe"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      args:
        APP_VERSION: local
    environment:
      DATABASE_URL: postgresql+psycopg://cafe:cafe@db:5432/cafe
      DESCONTO_MAXIMO: "50"
      PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dados:
